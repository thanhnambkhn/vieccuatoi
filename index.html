<!DOCTYPE html>
<html lang="vi">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Việc của tôi</title>
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://telegram.org" crossorigin>
<link rel="preconnect" href="https://script.google.com" crossorigin>
<script async id="tgWebAppScript" src="https://telegram.org/js/telegram-web-app.js"></script>
<!--
  index.html — Bảng việc (Telegram Mini App) chạy trên trang riêng (GitHub Pages). File này được sinh từ Dashboard.html.
  Không chứa khóa hay dữ liệu: khóa (k) và link Apps Script (a) nằm trong link mà bot gửi.
  • Mở trong Telegram (nút 📊 cạnh ô chat): tự lấy màu theme Telegram qua tgWebAppThemeParams.
  • Mở bằng trình duyệt: dùng màu sáng/tối theo hệ điều hành.
  • Theme Telegram được kiểm tra tương phản; vùng an toàn và thao tác bàn phím được hỗ trợ.
  • Bố cục iOS dùng dữ liệu thật; nút chi tiết mở bảng thông tin, nút hoàn thành vẫn xác nhận hai lần.
-->
<style>
  :root {
    /* Màu hệ thống kiểu iOS (sáng). Mở trong Telegram thì bị ghi đè bằng theme Telegram. */
    --page: #f5f5f7; --section: #ffffff; --text: #1d1d1f; --hint: #6e6e73; --sub: #6e6e73;
    --accent: #005ec4; --accent-text: #ffffff; --button: #005ec4; --selected-bg: #e7f2ff; --selected-text: #005ec4; --sep: rgba(60,60,67,.08); --wash: rgba(118,118,128,.12);
    --header-text: #6c6c70; --destructive: #c62828;
    --event: #007aff; --task: #ff9500; --critical: #c62828; --person: #7d5bd0;
    --good: #34c759; --good-text: #1d8a3b; --warning: #ff9500;
    --series-1: #2a78d6; --series-2: #eb6834; --grid: #e1e0d9; --axis: #c3c2b7;
    --shadow: 0 2px 10px rgba(25,25,40,.035);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #000000; --section: #1c1c1e; --text: #ffffff; --hint: #8e8e93; --sub: #aeaeb2;
      --accent: #0a84ff; --sep: rgba(84,84,88,.55); --wash: rgba(118,118,128,.24); --header-text: #8e8e93;
      --event: #0a84ff; --task: #ff9f0a; --critical: #ff453a; --person: #a78bfa; --good: #30d158; --good-text: #30d158;
      --series-1: #3987e5; --series-2: #d95926; --grid: #2c2c2a; --axis: #383835; --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --event: #0a84ff; --task: #ff9f0a; --critical: #ff453a; --person: #a78bfa; --good: #30d158; --good-text: #30d158;
    --series-1: #3987e5; --series-2: #d95926; --grid: #2c2c2a; --axis: #383835; --wash: rgba(118,118,128,.24); --shadow: none;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--page); color: var(--text); overscroll-behavior-y: contain; }
  body { font: 400 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; letter-spacing: 0; }
  button, input { font: inherit; color: inherit; letter-spacing: inherit; }
  .app { max-width: 430px; margin: 0 auto;
    padding: max(env(safe-area-inset-top, 0px), var(--tg-safe-area-inset-top, 0px), var(--tg-content-safe-area-inset-top, 0px))
      max(env(safe-area-inset-right, 0px), var(--tg-safe-area-inset-right, 0px), var(--tg-content-safe-area-inset-right, 0px))
      calc(24px + max(env(safe-area-inset-bottom, 0px), var(--tg-safe-area-inset-bottom, 0px), var(--tg-content-safe-area-inset-bottom, 0px)))
      max(env(safe-area-inset-left, 0px), var(--tg-safe-area-inset-left, 0px), var(--tg-content-safe-area-inset-left, 0px)); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .search:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg.i { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  .icon-btn { width: 44px; height: 44px; border-radius: 13px; border: 1px solid var(--sep); background: var(--section); color: var(--accent);
    display: grid; place-items: center; cursor: pointer; font-size: 19px; flex: none; }
  .icon-btn:active { background: var(--wash); }
  .top { position: sticky; top: max(env(safe-area-inset-top, 0px), var(--tg-safe-area-inset-top, 0px), var(--tg-content-safe-area-inset-top, 0px)); z-index: 5; padding: 4px 16px 3px; background: color-mix(in srgb, var(--page) 94%, transparent);
    -webkit-backdrop-filter: saturate(1.8) blur(14px); backdrop-filter: saturate(1.8) blur(14px); }
  .top-row { display: flex; align-items: center; gap: 6px; }
  .top-row .tabs { flex: 1; min-width: 0; }
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; background: var(--wash); border-radius: 12px; padding: 3px; }
  .tabs button { border: 0; background: transparent; padding: 5px 0; border-radius: 9px; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--sub); min-height: 34px; }
  .tabs button[aria-selected="true"] { background: var(--section); color: var(--text); font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  :root[data-theme="dark"] .tabs button:is([aria-selected="true"], [aria-pressed="true"]) { background: rgba(255,255,255,.16); box-shadow: none; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tabs button:is([aria-selected="true"], [aria-pressed="true"]) { background: rgba(255,255,255,.16); box-shadow: none; } }

  /* Dải tóm tắt: chỉ hiện mục có số khác 0 */
  .pills { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 14px 0; }
  .pill { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 10px; border-radius: 15px; font-size: 13px; font-weight: 500;
    background: var(--section); box-shadow: var(--shadow); color: var(--sub); }
  .pill b { font-size: 14px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
  .pill.crit { background: var(--section); color: var(--critical); } .pill.crit b { color: var(--critical); }
  .pill.warn { background: color-mix(in srgb, var(--warning) 15%, var(--section)); color: color-mix(in srgb, var(--warning) 80%, var(--text)); }

  /* Ô tóm tắt (tab Thống kê) */
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 4px 14px 0; }
  .stat { min-width: 0; min-height: 116px; background: var(--section); border: 1px solid var(--sep); border-radius: 16px; padding: 14px 13px; box-shadow: var(--shadow); }
  .stat .v { font-size: 28px; font-weight: 600; line-height: 1.15; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 12px; font-weight: 600; color: var(--sub); margin-top: 6px; display: flex; gap: 5px; align-items: center; }
  .stat .d { font-size: 11.5px; color: var(--hint); margin-top: 6px; }
  .stat .d.up-good { color: var(--good-text); }

  /* Khối ngày / nhóm */
  .sec-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 8px; padding: 20px 17px 9px; }
  .sec-h .nm { font-size: 18px; font-weight: 600; line-height: 1.25; letter-spacing: -.02em; }
  .sec-h .dt { font-size: 12.5px; color: var(--sub); }
  .sec-h .cnt { font-size: 11.5px; font-weight: 600; color: var(--sub); background: var(--wash); border-radius: 999px; padding: 3px 7px; }
  .sec-h .ico { align-self: center; }
  .sec-h.crit .nm { color: var(--critical); }
  .sec-h.crit .cnt { color: var(--critical); background: color-mix(in srgb, var(--critical) 8%, var(--section)); }
  .sec-h.small { padding-top: 16px; } .sec-h.small .nm { font-size: 12.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; color: var(--header-text); }
  .sec { background: var(--section); border: 1px solid var(--sep); border-radius: 16px; margin: 0 16px; overflow: hidden; box-shadow: var(--shadow); }
  .sec-f { font-size: 12.5px; color: var(--hint); padding: 7px 18px 0; }

  /* Một dòng việc */
  .item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; min-height: 54px; position: relative; }
  .item + .item::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; border-top: .5px solid var(--sep); }
  .item .lead { width: 28px; flex: none; display: grid; place-items: center; }
  .item .body { flex: 1; min-width: 0; }
  .item .t { overflow-wrap: anywhere; font-size: 14px; font-weight: 500; }
  .item .s { font-size: 12.5px; color: var(--hint); margin-top: 2px; overflow-wrap: anywhere; }
  .item .tail { flex: none; font-size: 12.5px; color: var(--hint); text-align: right; font-variant-numeric: tabular-nums; }
  a.item { color: inherit; text-decoration: none; cursor: pointer; }
  a.item:active, .item.tap:active { background: var(--wash); }
  .live { color: var(--critical); font-weight: 600; }
  .empty { padding: 14px; color: var(--hint); font-size: 14px; }
  .tile { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: #fff; font-size: 16px; background: var(--hint); }
  .tile.event { background: var(--event); } .tile.task { background: var(--task); } .tile.done { background: var(--good); }
  .tile.person { background: var(--person); } .tile.draft { background: var(--hint); } .tile.note { background: #5e5ce6; } .tile.crit { background: var(--critical); }

  /* Dòng lịch/việc trong "Tuần này": giờ bên trái · vạch màu · nội dung · nút xong */
  .row { padding: 12px 6px 12px 12px; gap: 4px; align-items: stretch; min-height: 76px; }
  .row .bar { width: 3px; margin-right: 6px; border-radius: 3px; flex: none; background: var(--event); }
  .row.task .bar { background: var(--task); }
  .row.over .bar { background: var(--critical); }
  .row .main { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
  .row .ttl { font-size: 14px; line-height: 1.4; font-weight: 500; letter-spacing: -.01em; overflow-wrap: anywhere; }
  .detail-btn { align-self: flex-start; min-height: 44px; border: 0; background: transparent; padding: 6px 0 0; text-align: left; font-size: 12px; font-weight: 600; color: var(--accent); cursor: pointer; }
  .row .meta { display: flex; flex-wrap: wrap; gap: 4px 7px; align-items: center; margin-top: 6px; font-size: 12px; line-height: 1.35; color: var(--sub); }
  .row .meta .detail-btn { min-height: 44px; padding: 0; align-self: center; }
  .row .meta .meeting { color: var(--accent); font-weight: 600; }
  .row .meta > span + span:not(.confirm-hint)::before { content: "·"; margin-right: 8px; color: var(--hint); }
  .row .meta .late { color: var(--critical); }
  .who { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 7px 0 5px; border-radius: 11px; font-size: 12.5px; font-weight: 600;
    background: color-mix(in srgb, var(--person) 14%, transparent); color: var(--person); max-width: 100%; }
  .who .i { font-size: 13px; }
  .row .act { width: 44px; flex: none; display: grid; place-items: center; }
  .meta:empty { display: none; }
  .item .act { width: 44px; margin-right: -8px; display: grid; place-items: center; flex: none; }
  .row .act { margin-right: 0; }

  .today-empty { display: flex; align-items: center; gap: 12px; padding: 16px 14px; color: var(--text); }
  .today-empty .tile { background: color-mix(in srgb, var(--accent) 8%, var(--section)); color: var(--accent); border-radius: 12px; width: 34px; height: 34px; font-size: 19px; }
  .today-empty strong { display: block; font-size: 14px; font-weight: 600; margin-bottom: 3px; }
  .today-empty p { margin: 0; font-size: 12px; line-height: 1.4; color: var(--sub); }
  .quiet { margin: 12px 18px 0; font-size: 13px; color: var(--hint); line-height: 1.45; }

  /* Vòng tròn đánh dấu xong — chạm 1 lần hỏi lại, chạm lần 2 xác nhận. Vùng chạm 44px. */
  .chk { width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; padding: 0; cursor: pointer; display: grid; place-items: center; position: relative; color: transparent; }
  .chk::before { content: ""; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--hint); transition: all .15s; position: absolute; }
  .chk svg { position: relative; width: 12px; height: 12px; stroke-width: 2.5; }
  .chk.armed { color: #fff; } .chk.armed::before { border-color: var(--good); background: var(--good); }
  .chk:disabled { opacity: .5; }
  .confirm-hint { color: var(--good-text); font-size: 12px; font-weight: 600; }

  /* Huy hiệu trạng thái: luôn có biểu tượng + chữ, không dùng màu đơn thuần */
  .ico { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; font-size: 10px; font-weight: 600; color: #fff; flex: none; }
  .ico-critical { background: var(--critical); } .ico-good { background: var(--good); } .ico-warning { background: var(--warning); color: #0b0b0b; }
  .badge { display: inline-flex; gap: 4px; align-items: center; font-size: 12.5px; color: var(--sub); white-space: nowrap; }

  /* Bộ lọc dạng chip + ô tìm */
  /* Dải chọn: Của tôi | Đã giao | Tất cả (dưới tab, ẩn ở tab Thống kê) */
  .own { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .own[hidden] { display: none; }
  .own button { border: 1px solid var(--sep); background: var(--section); color: var(--sub); border-radius: 999px; min-height: 34px; padding: 5px 12px; font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .own button[aria-pressed="true"] { background: var(--selected-bg); border-color: color-mix(in srgb, var(--accent) 35%, var(--section)); color: var(--selected-text); }
  .own .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--critical); margin-left: 6px; vertical-align: middle; }
  .av { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; background: var(--person); color: #fff; font-size: 10.5px; font-weight: 700; line-height: 1; }
  .item .person-lead { width: 36px; }
  .person-lead .av { width: 36px; height: 36px; border-radius: 12px; font-size: 13px; background: color-mix(in srgb, var(--person) 10%, var(--section)); color: var(--person); }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 4px 14px 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 0; background: var(--section); color: var(--text); border-radius: 17px; min-height: 44px; padding: 0 12px; font-size: 13px; font-weight: 500; cursor: pointer; box-shadow: var(--shadow); }
  .chip[aria-pressed="true"] { background: var(--selected-bg); color: var(--selected-text); font-weight: 600; }
  .search { margin: 6px 14px 8px; display: flex; align-items: center; gap: 8px; background: var(--wash); border-radius: 11px; padding: 0 10px; color: var(--hint); }
  .search input { border: 0; outline: 0; background: transparent; padding: 9px 0; flex: 1; min-width: 0; color: var(--text); }
  .more { display: block; width: calc(100% - 28px); margin: 10px 14px 0; border: 0; background: var(--section); color: var(--accent); border-radius: 13px; padding: 12px; cursor: pointer; font-weight: 500; box-shadow: var(--shadow); }

  /* Biểu đồ */
  .chart { padding: 12px 14px 10px; }
  .chart svg { max-width: 100%; height: auto; }
  .chart h3 { margin: 0; font-size: 15px; font-weight: 600; }
  .chart .cap { font-size: 12.5px; color: var(--hint); margin: 2px 0 7px; }
  .legend { display: flex; gap: 12px; font-size: 12.5px; color: var(--sub); margin-bottom: 4px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .key-line { width: 14px; height: 2px; border-radius: 1px; display: inline-block; }
  svg text { font-family: inherit; }
  .gridline { stroke: var(--grid); stroke-width: 1; } .axisline { stroke: var(--axis); stroke-width: 1; }
  .ticklbl { fill: var(--hint); font-size: 10.5px; font-variant-numeric: tabular-nums; }
  .endlbl { fill: var(--sub); font-size: 11px; font-weight: 600; }
  .cols { display: grid; grid-template-columns: repeat(7, 1fr); align-items: end; height: 132px; gap: 4px; border-bottom: 1px solid var(--axis); }
  .col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .col .v { font-size: 11.5px; color: var(--sub); font-variant-numeric: tabular-nums; margin-bottom: 3px; }
  .col .bar { width: min(24px, 70%); background: var(--series-1); border-radius: 4px 4px 0 0; }
  .col-lbls { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; font-size: 11px; color: var(--hint); text-align: center; margin-top: 4px; }
  .hbar-row { display: grid; grid-template-columns: minmax(80px, 36%) 1fr 28px; gap: 8px; align-items: center; padding: 4px 0; font-size: 13.5px; }
  .hbar-row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--sub); }
  .hbar { height: 14px; background: var(--series-1); border-radius: 0 4px 4px 0; min-width: 2px; }
  .hbar-row .n { text-align: right; font-variant-numeric: tabular-nums; }
  details.data { margin-top: 7px; font-size: 12.5px; color: var(--sub); }
  details.data summary { cursor: pointer; color: var(--accent); }
  details.data table { border-collapse: collapse; width: 100%; margin-top: 4px; }
  details.data td, details.data th { padding: 4px 6px; border-bottom: .5px solid var(--sep); text-align: left; font-weight: 500; }
  details.data .num { text-align: right; font-variant-numeric: tabular-nums; }
  .seg { display: flex; justify-content: center; padding: 16px 16px 0; }
  .seg .tabs { width: 100%; }
  .detail-sheet { width: min(430px, calc(100% - 24px)); max-height: 85dvh; margin: auto auto 0; padding: 12px 18px calc(20px + max(env(safe-area-inset-bottom, 0px), var(--tg-safe-area-inset-bottom, 0px), var(--tg-content-safe-area-inset-bottom, 0px))); border: 1px solid var(--sep); border-radius: 20px 20px 0 0; background: var(--section); color: var(--text); box-shadow: 0 -10px 40px rgba(0,0,0,.12); }
  .detail-sheet::backdrop { background: rgba(0,0,0,.35); }
  .sheet-handle { height: 5px; width: 38px; border-radius: 10px; background: var(--sep); margin: 0 auto 16px; }
  .detail-sheet h2 { font-size: 17px; line-height: 1.35; font-weight: 600; margin: 0 0 10px; overflow-wrap: anywhere; }
  .detail-sheet p { font-size: 13.5px; line-height: 1.45; color: var(--sub); white-space: pre-line; overflow-wrap: anywhere; }
  .sheet-close { width: 100%; min-height: 44px; margin-top: 12px; padding: 11px; border: 0; border-radius: 12px; background: var(--button); color: var(--accent-text); font-size: 14px; font-weight: 600; cursor: pointer; }
  @media (min-width: 600px) { .detail-sheet { margin: auto; border-radius: 20px; } }

  .tip { position: fixed; z-index: 20; pointer-events: none; background: var(--section); color: var(--text); border-radius: 10px;
    padding: 7px 9px; font-size: 12px; box-shadow: 0 4px 18px rgba(0,0,0,.18); min-width: 110px; }
  .tip .h { color: var(--sub); margin-bottom: 3px; }
  .tip .r { display: flex; align-items: center; gap: 8px; }
  .tip .r b { font-variant-numeric: tabular-nums; min-width: 20px; }
  .tip .r span { color: var(--sub); }
  .toast { position: fixed; left: 50%; bottom: calc(18px + max(env(safe-area-inset-bottom, 0px), var(--tg-safe-area-inset-bottom, 0px), var(--tg-content-safe-area-inset-bottom, 0px))); transform: translateX(-50%); background: #28282a; color: #fff;
    max-width: calc(100% - 32px); overflow-wrap: anywhere; padding: 10px 16px; border-radius: 20px; font-size: 14px; font-weight: 500; z-index: 30; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
  .tabs button[aria-pressed="true"] { background: var(--section); color: var(--text); font-weight: 600; }
  .icon-btn:disabled { opacity: 1; cursor: progress; }
  .icon-btn:disabled svg { animation: reload-spin 1s linear infinite; }
  .pull-status { text-align: center; color: var(--sub); font-size: 12px; padding: 4px 16px; }
  @keyframes reload-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .icon-btn:disabled svg { animation: none; } }
  .warn { margin: 10px 14px 0; padding: 10px 12px; border-radius: 13px; background: var(--section); font-size: 13px; color: var(--sub); }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="top-row">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="week" aria-selected="true">Tuần này</button>
        <button type="button" role="tab" data-tab="stats" aria-selected="false">Thống kê</button>
        <button type="button" role="tab" data-tab="all" aria-selected="false">Tất cả</button>
      </div>
      <button class="icon-btn" id="btnRefresh" type="button" aria-label="Làm mới" title="Làm mới"></button>
    </div>
    <div class="own" id="own" role="group" aria-label="Lọc theo người làm"></div>
    <div class="pull-status" id="pullStatus" role="status" hidden></div>
  </div>
  <main id="main"></main>
</div>
<div class="tip" id="tip" role="tooltip" hidden></div>
<dialog class="detail-sheet" id="detailSheet" aria-labelledby="detailTitle">
  <div class="sheet-handle" aria-hidden="true"></div>
  <h2 id="detailTitle"></h2>
  <p id="detailText"></p>
  <form method="dialog"><button class="sheet-close">Đóng</button></form>
</dialog>

<script>
const _P = new URLSearchParams(location.search);
const KEY = _P.get('k') || '', API = _P.get('a') || '';   // khóa + link /exec do bot gắn vào link mở trang
let DATA = API ? loadCache() : null;                                  // hiện ngay bản lần trước, rồi tải số liệu mới

// ============================================================ tiện ích
const DAY = 86400000, WD = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
const UI = { tab: 'week', range: 30, filter: 'ACTIVE', q: '', limit: 40, own: loadOwn() };
/** Lọc theo người làm: mine = việc của tôi · deleg = việc đã giao · all = cả hai. Nhớ lựa chọn cho lần mở sau (mặc định: mine). */
function loadOwn() { try { const v = localStorage.getItem('dash_own_v1'); return v === 'deleg' || v === 'all' ? v : 'mine'; } catch (e) { return 'mine'; } }
function saveOwn(v) { try { localStorage.setItem('dash_own_v1', v); } catch (e) { /* bỏ qua */ } }
const pad = n => (n < 10 ? '0' : '') + n;
const off = () => DATA.tzOffsetMin * 60000;
const dayIdx = ms => Math.floor((ms + off()) / DAY);                 // số ngày theo giờ VN
const dayDate = idx => new Date(idx * DAY);                           // đọc bằng getUTC*
const fmtDay = idx => { const d = dayDate(idx); return WD[d.getUTCDay()] + ' ' + pad(d.getUTCDate()) + '/' + pad(d.getUTCMonth() + 1); };
const fmtDT = ms => { const d = new Date(ms + off()); return pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()) + ' ' + fmtDay(dayIdx(ms)); };
const nf = n => Number(n).toLocaleString('vi-VN');

function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if (c == null || c === false || c === '') return; e.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c); });
  return e;
}
function sv(tag, attrs) { const e = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }
const ico = (kind, ch) => el('span', { class: 'ico ico-' + kind, 'aria-hidden': 'true', text: ch });
/** Bộ biểu tượng nét mảnh (kiểu SF Symbols) — thay cho emoji để giao diện đồng nhất. */
const PATHS = {
  cal: '<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/>',
  task: '<rect x="4" y="4" width="16" height="16" rx="4"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/>',
  done: '<circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16 9.5"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  note: '<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>',
  person: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>',
  refresh: '<path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/>',
  check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  chev: '<path d="m9 6 6 6-6 6"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/>',
  alert: '<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.5"/>',
};
function svgi(name) { const x = sv('svg', { class: 'i', viewBox: '0 0 24 24', 'aria-hidden': 'true' }); x.innerHTML = PATHS[name] || ''; return x; }
const tile = (name, cls) => el('span', { class: 'tile ' + (cls || ''), 'aria-hidden': 'true' }, svgi(name));

const tip = document.getElementById('tip');
function showTip(ev, head, rows) {
  tip.replaceChildren(el('div', { class: 'h', text: head }), ...rows.map(r => el('div', { class: 'r' },
    r.color ? el('span', { class: 'key-line', style: 'background:' + r.color }) : null, el('b', { text: String(r.value) }), el('span', { text: r.label }))));
  tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = ev.clientX + 12, y = ev.clientY - h - 12;
  if (x + w > innerWidth - 8) x = Math.max(8, ev.clientX - w - 12);
  if (y < 8) y = ev.clientY + 16;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
const hideTip = () => { tip.hidden = true; };
function toast(msg) { const t = el('div', { class: 'toast', role: 'status', text: msg }); document.body.appendChild(t); setTimeout(() => t.remove(), 3500); }
function showDetails(title, text) {
  document.getElementById('detailTitle').textContent = title;
  document.getElementById('detailText').textContent = text;
  document.getElementById('detailSheet').showModal();
}
let detailRequest = 0;
function showItemDetails(id, fallbackTitle) {
  const request = ++detailRequest, dialog = document.getElementById('detailSheet');
  showDetails(fallbackTitle, 'Đang tải chi tiết…');
  server('details', id)
    .then(d => {
      if (request !== detailRequest || !dialog.open) return;
      document.getElementById('detailTitle').textContent = d.title || fallbackTitle;
      document.getElementById('detailText').textContent = [
        d.type, d.status, d.assignee ? 'Giao cho: ' + d.assignee : '',
        d.content && d.content !== d.title ? 'Nội dung:\n' + d.content : '',
        d.source ? 'Nguồn:\n' + d.source : '',
      ].filter(Boolean).join('\n\n') || 'Không có nội dung chi tiết.';
    })
    .catch(e => {
      if (request === detailRequest && dialog.open) document.getElementById('detailText').textContent = 'Không tải được chi tiết: ' + errMsg(e);
    });
}
document.getElementById('detailSheet').addEventListener('click', ev => {
  if (ev.target !== ev.currentTarget) return;
  const bounds = ev.currentTarget.getBoundingClientRect();
  if (ev.clientX < bounds.left || ev.clientX > bounds.right || ev.clientY < bounds.top || ev.clientY > bounds.bottom) ev.currentTarget.close();
});

// ============================================================ theme Telegram
/** Telegram truyền màu theme qua #tgWebAppThemeParams trên URL; trang Apps Script đọc bằng google.script.url. */
function applyTelegramTheme(hash) {
  try {
    const m = /tgWebAppThemeParams=([^&]+)/.exec(hash || '');
    if (m) applyThemeParams(JSON.parse(decodeURIComponent(m[1])));
  } catch (e) { /* không có theme → dùng màu mặc định */ }
}
function applyThemeParams(p) {
  try {
    ['--text', '--hint', '--sub', '--header-text', '--accent', '--button', '--accent-text', '--critical', '--good-text']
      .forEach(name => document.documentElement.style.removeProperty(name));
    const set = (v, c) => { if (c) document.documentElement.style.setProperty(v, c); };
    set('--page', p.secondary_bg_color || p.bg_color);
    set('--section', p.section_bg_color || p.bg_color);
    set('--text', p.text_color);
    set('--hint', p.hint_color);
    set('--sub', p.subtitle_text_color || p.hint_color);
    set('--accent', p.accent_text_color || p.button_color || p.link_color);
    set('--button', p.button_color);
    set('--accent-text', p.button_text_color);
    set('--sep', p.section_separator_color);
    set('--header-text', p.section_header_text_color || p.hint_color);
    set('--destructive', p.destructive_text_color);
    // Nền tối → dùng bước màu dữ liệu cho nền tối
    const bg = (p.bg_color || '#ffffff').replace('#', '');
    const lum = (0.299 * parseInt(bg.substr(0, 2), 16) + 0.587 * parseInt(bg.substr(2, 2), 16) + 0.114 * parseInt(bg.substr(4, 2), 16)) / 255;
    document.documentElement.setAttribute('data-theme', lum < 0.5 ? 'dark' : 'light');
    ensureContrast();
    if (UI.tab === 'stats' && DATA) render();               // vẽ lại biểu đồ với màu mới
  } catch (e) { /* bỏ qua */ }
}

function colorLuminance(color) {
  const rgb = color.match(/[a-f\d]{2}/gi).map(v => parseInt(v, 16) / 255)
    .map(v => v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
  return rgb[0] * 0.2126 + rgb[1] * 0.7152 + rgb[2] * 0.0722;
}
function contrastRatio(a, b) {
  const x = colorLuminance(a), y = colorLuminance(b);
  return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05);
}
function ensureContrast() {
  const root = document.documentElement, css = getComputedStyle(root);
  const get = name => css.getPropertyValue(name).trim();
  const surfaces = [get('--page'), get('--section')];
  // Telegram supplies hex colors. Keep theme colors unless readability requires a fallback.
  const fix = (name, backgrounds) => {
    const color = get(name);
    if (![color, ...backgrounds].every(c => /^#[a-f\d]{6}$/i.test(c))) {
      console.warn('Unsupported theme color', name, color);
      return;
    }
    if (backgrounds.every(bg => contrastRatio(color, bg) >= 4.5)) return;
    const best = ['#000000', '#ffffff'].sort((a, b) =>
      Math.min(...backgrounds.map(bg => contrastRatio(b, bg))) - Math.min(...backgrounds.map(bg => contrastRatio(a, bg))))[0];
    const original = color.match(/[a-f\d]{2}/gi).map(v => parseInt(v, 16));
    const target = best === '#000000' ? 0 : 255;
    for (let step = 1; step <= 100; step++) {
      const adjusted = '#' + original.map(v => Math.round(v + (target - v) * step / 100).toString(16).padStart(2, '0')).join('');
      if (backgrounds.every(bg => contrastRatio(adjusted, bg) >= 4.5)) {
        root.style.setProperty(name, adjusted);
        return;
      }
    }
    console.warn('Theme surfaces require different text colors', name, backgrounds);
    root.style.setProperty(name, best);
  };
  ['--text', '--hint', '--sub', '--header-text', '--accent', '--critical', '--good-text'].forEach(name => fix(name, surfaces));
  fix('--accent-text', [get('--button')]);
  const accent = get('--accent'), surface = get('--section');
  if (/^#[a-f\d]{6}$/i.test(accent) && /^#[a-f\d]{6}$/i.test(surface)) {
    const a = accent.match(/[a-f\d]{2}/gi), b = surface.match(/[a-f\d]{2}/gi);
    const tint = '#' + a.map((v, k) => Math.round(parseInt(v, 16) * 0.1 + parseInt(b[k], 16) * 0.9).toString(16).padStart(2, '0')).join('');
    root.style.setProperty('--selected-bg', tint);
    root.style.setProperty('--selected-text', accent);
    fix('--selected-text', [tint]);
  }
}

// ============================================================ gọi server
const hasGAS = () => typeof google !== 'undefined' && google.script && google.script.run;
/** Hai chế độ: (1) chạy trong Apps Script → google.script.run; (2) trang riêng (GitHub Pages) → fetch tới link /exec (API). */
const FETCH_MODE = typeof API !== 'undefined' && !!API;
const canCall = () => FETCH_MODE || hasGAS();
let LOADERR = '';
function saveCache(d) { if (FETCH_MODE) try { localStorage.setItem('dash_cache_v1', JSON.stringify(d)); } catch (e) { /* bỏ qua */ } }
function loadCache() { try { return JSON.parse(localStorage.getItem('dash_cache_v1') || 'null'); } catch (e) { return null; } }
/** op 'data' = lấy số liệu; 'done' = hoàn thành; 'details' = xem nội dung việc. */
function server(op, ref, force) {
  if (FETCH_MODE) {
    const u = API + (API.indexOf('?') < 0 ? '?' : '&') + 'view=api&op=' + op + '&key=' + encodeURIComponent(KEY) +
      (ref ? '&ref=' + encodeURIComponent(ref) : '') + (force ? '&fresh=1' : '') + '&_=' + Date.now();
    return fetch(u, { redirect: 'follow' }).then(r => r.json()).then(j => {
      if (!j || !j.ok) throw new Error((j && j.error) || 'Lỗi máy chủ');
      if (op !== 'details') saveCache(j.data); return j.data;
    });
  }
  return new Promise((res, rej) => {
    const r = google.script.run.withSuccessHandler(s => res(JSON.parse(s))).withFailureHandler(rej);
    if (op === 'done') r.dashMarkDone(KEY, ref);
    else if (op === 'details') r.dashItemDetails(KEY, ref);
    else r.dashData(KEY, force);
  });
}
const errMsg = e => (e && e.message) ? e.message : String(e);
function setBusy(b) {
  document.getElementById('main').setAttribute('aria-busy', String(b));
  const button = document.getElementById('btnRefresh');
  button.disabled = b;
  button.setAttribute('aria-label', b ? 'Đang cập nhật' : 'Làm mới');
}
function refresh(silent, force) {
  if (!canCall()) return toast('Bản xem thử');
  setBusy(true);
  return server('data', null, force)
    .then(d => { DATA = d; LOADERR = ''; setBusy(false); render(); if (!silent) toast('Đã cập nhật'); })
    .catch(e => { setBusy(false); if (!DATA) { LOADERR = errMsg(e); render(); } else if (!silent) toast('Lỗi: ' + errMsg(e)); });
}
/** Vòng tròn ✓: chạm 1 lần → chuyển xanh "Xong?", chạm lần 2 trong 3 giây → đánh dấu xong. */
function check(ref, hintHost) {
  const b = el('button', { class: 'chk', type: 'button', 'aria-label': 'Đánh dấu xong' }, svgi('check'));
  let armed = null, hint = null;
  const disarm = () => { armed = null; b.classList.remove('armed'); if (hint) { hint.remove(); hint = null; } };
  b.addEventListener('click', ev => {
    ev.stopPropagation();
    if (!armed) {
      b.classList.add('armed');
      if (hintHost) { hint = el('span', { class: 'confirm-hint', text: ' · chạm lần nữa để xong' }); hintHost.appendChild(hint); }
      armed = setTimeout(disarm, 3000);
      return;
    }
    clearTimeout(armed);
    if (!canCall()) { disarm(); return toast('Bản xem thử'); }
    b.disabled = true; setBusy(true);
    server('done', ref)
      .then(d => { DATA = d; setBusy(false); render(); toast('✅ Đã xong'); })
      .catch(e => { setBusy(false); b.disabled = false; disarm(); toast('Lỗi: ' + errMsg(e)); });
  });
  return b;
}

// ============================================================ quy tắc trạng thái
/** Lịch đã kết thúc: bot không tự đóng lịch nên không tính là việc đang mở. */
function isPastEvent(i) {
  if (i.ty !== 'EVENT' || i.st !== 'OPEN' || !i.d) return false;
  return (i.e || (i.ht ? i.d + 3600000 : (dayIdx(i.d) + 1) * DAY - off())) < DATA.now;
}
const isActiveOpen = i => i.st === 'OPEN' && !isPastEvent(i);
const who = i => i.a ? 'Giao ' + i.a + ' · ' : '';
const ownItem = i => UI.own === 'all' || (UI.own === 'deleg') === !!i.a;            // việc (trong Sheet) có hợp bộ lọc không
const ownRow = r => UI.own === 'all' || (UI.own === 'deleg') === !!parseWho(r.title).who;  // dòng tuần (lịch/Google Tasks không có người → của tôi)
const avatar = name => el('span', { class: 'av', 'aria-hidden': 'true', text: (String(name).trim()[0] || '?').toUpperCase() });                     // việc đã giao cho nhân viên
function isOverdue(i) {
  if (i.st !== 'OPEN' || i.ty !== 'TASK' || !i.d) return false;
  return i.ht ? i.d < DATA.now : dayIdx(i.d) < dayIdx(DATA.now);
}

// ============================================================ dòng danh sách
/** Một dòng: [ô biểu tượng] [tiêu đề + dòng phụ] [đuôi] [chi tiết / xong] */
function item(opts) {
  const sub = opts.sub ? el('div', { class: 's', text: opts.sub }) : null;
  const subHost = sub || el('div', { class: 's' });
  const details = opts.detailRef ? el('button', { type: 'button', class: 'detail-btn', 'aria-haspopup': 'dialog',
    text: 'Xem', onclick: () => showItemDetails(opts.detailRef, opts.title) }) : null;
  return el('div', { class: 'item' },
    opts.person ? el('div', { class: 'lead person-lead' }, avatar(opts.person)) :
      (opts.tile ? el('div', { class: 'lead' }, tile(opts.tile[0], opts.tile[1])) : null),
    el('div', { class: 'body' }, el('div', { class: 't', text: opts.title }), sub || (opts.ref ? subHost : null), details),
    opts.tail ? el('div', { class: 'tail' }, opts.tail) : null,
    opts.ref ? el('div', { class: 'act' }, check(opts.ref, subHost)) : null);
}
/** Tiêu đề nhóm. cls 'small' = chữ nhỏ viết hoa (nhóm phụ); 'crit' = đỏ. */
const secH = (label, cnt, icon, cls) => el('div', { class: 'sec-h ' + (cls || '') }, icon || null, el('span', { class: 'nm', text: label }),
  cnt != null ? el('span', { class: 'cnt', text: String(cnt) }) : null);

// ============================================================ TAB 1: Tuần này
const WDN = { CN: 'Chủ nhật', T2: 'Thứ Hai', T3: 'Thứ Ba', T4: 'Thứ Tư', T5: 'Thứ Năm', T6: 'Thứ Sáu', T7: 'Thứ Bảy' };
/** Tiêu đề do server ghép dạng "👤 Huy · việc" → tách tên người để hiện thành nhãn riêng. */
function parseWho(title) { const m = /^👤\s*(.+?)\s·\s([\s\S]*)$/.exec(title); return m ? { who: m[1], title: m[2] } : { who: '', title: title }; }

/** Dòng lịch/việc ưu tiên tiêu đề; thời gian và người nhận nằm trong dòng phụ. */
function weekRow(r, over, dayLabel) {
  const w = parseWho(r.title), isEv = r.kind === 'event';
  const note = (r.note || '').replace(/^\(|\)$/g, '');
  const source = DATA.items.find(i => i.id === r.ref);
  const daysLate = source && source.d ? Math.max(0, dayIdx(DATA.now) - dayIdx(source.d)) : 0;
  const status = over ? (daysLate ? 'Trễ ' + daysLate + ' ngày' : 'Quá hạn') : '';
  const timing = over ? (source && source.d ? 'Hạn ' + (source.ht ? fmtDT(source.d) : fmtDay(dayIdx(source.d))) : note)
    : (isEv ? '' : 'Hạn ') + (r.time || 'Cả ngày');
  const live = /đang diễn ra/i.test(note);
  const details = el('button', { type: 'button', class: 'detail-btn', 'aria-haspopup': 'dialog',
    text: isEv ? 'Xem lịch hẹn' : 'Xem', onclick: () =>
      source ? showItemDetails(source.id, w.title)
        : showDetails(w.title, [dayLabel, status, timing, note, w.who ? 'Người nhận: ' + w.who : ''].filter(Boolean).join('\n')) });
  const meta = el('div', { class: 'meta' },
    details,
    status ? el('span', { class: 'late', text: status }) : null,
    el('span', { class: isEv ? 'meeting' : '', text: timing }),
    isEv && dayLabel ? el('span', { text: dayLabel }) : null,
    w.who ? el('span', { class: 'who' }, avatar(w.who), w.who) : null,
    live ? el('span', { class: 'live', text: 'Đang diễn ra' }) :
      (!over && note && !/^trong ngày$/i.test(note) ? el('span', { text: note }) : null));
  const row = el('div', { class: 'item row ' + (over ? 'over ' : '') + (isEv ? 'event' : 'task') },
    el('i', { class: 'bar' }),
    el('div', { class: 'main' }, el('div', { class: 'ttl', text: w.title }), meta),
    r.ref ? el('div', { class: 'act' }, check(r.ref, meta)) : null);
  return row;
}

/** Chế độ "Đã giao": gom theo người, người có việc trễ lên đầu, mỗi việc bấm ✓ để ghi nhận đã xong. */
function renderDelegated(main) {
  const open = DATA.items.filter(i => i.a && isActiveOpen(i));
  const by = {};
  open.forEach(i => i.a.split(', ').forEach(n => (by[n] = by[n] || []).push(i)));
  const names = Object.keys(by).sort((a, b) => by[b].filter(isOverdue).length - by[a].filter(isOverdue).length || by[b].length - by[a].length);
  if (!names.length) {
    main.append(el('div', { class: 'sec' }, el('div', { class: 'empty', text: 'Chưa giao việc nào. Gõ "@Tên việc… hạn" trong chat, hoặc bấm 👤 trên thẻ việc.' })));
    return;
  }
  names.forEach(n => {
    const list = by[n].sort((a, b) => (a.d || 9e15) - (b.d || 9e15)), nl = list.filter(isOverdue).length;
    main.append(el('div', { class: 'sec-h' + (nl ? ' crit' : '') }, avatar(n), el('span', { class: 'nm', text: n }),
      el('span', { class: 'cnt', text: '· ' + list.length + (nl ? ' · ' + nl + ' trễ' : '') })));
    main.append(el('div', { class: 'sec' }, list.map(i => item({ ref: i.id, detailRef: i.id, title: i.t, sub: [i.dl || 'Chưa có hạn', i.src].filter(Boolean).join(' · '), tail: badge(i) }))));
  });
  main.append(el('div', { class: 'sec-f', text: 'Chạm ✓ khi nhân viên báo xong. Nhắc đôn đốc việc trễ do bot gửi lúc 9h sáng.' }));
}

function renderWeek(main) {
  if (UI.own === 'deleg') return renderDelegated(main);
  const W = DATA.week, items = DATA.items, today = dayIdx(DATA.now);
  const open = items.filter(isActiveOpen).filter(ownItem);
  const dueToday = open.filter(i => i.ty === 'TASK' && i.d && dayIdx(i.d) === today && !isOverdue(i)).length;
  const drafts = items.filter(i => i.st === 'DRAFT').filter(ownItem);
  const overdue = W.overdue.filter(ownRow);
  const nOver = overdue.length;

  // Dải tóm tắt: chỉ hiện mục có việc (không chiếm chỗ bằng số 0)
  const pills = [];
  if (dueToday) pills.push(el('span', { class: 'pill' }, el('b', { text: nf(dueToday) }), 'hạn nay'));
  if (drafts.length) pills.push(el('span', { class: 'pill warn' }, el('b', { text: nf(drafts.length) }), 'nháp'));

    const b = el('button', { type: 'button', 'aria-pressed': String(UI.own === o[0]), text: o[1] });
    if (o[0] === 'deleg' && late) b.append(el('span', { class: 'dot', 'aria-label': late + ' việc trễ' }));
    b.addEventListener('click', () => { UI.own = o[0]; saveOwn(o[0]); UI.limit = 40; render(); document.querySelector('.own [aria-pressed="true"]').focus(); scrollTo(0, 0); });
    return b;
  }));
}
function render() {
  const main = document.getElementById('main');
  document.querySelectorAll('.top .tabs button').forEach(b => {
    b.setAttribute('aria-selected', String(b.dataset.tab === UI.tab));
    b.tabIndex = b.dataset.tab === UI.tab ? 0 : -1;
    b.setAttribute('aria-controls', 'main');
  });
  main.setAttribute('role', 'tabpanel');
  main.setAttribute('aria-label', document.querySelector('.top [aria-selected="true"]').textContent);
  drawOwn();
  if (!DATA) {                                              // chưa có số liệu (trang riêng, lần mở đầu)
    setSubtitle('');
    main.replaceChildren(el('div', { class: 'quiet', style: 'text-align:center;margin-top:40px' }, LOADERR ? ['⚠️ ' + LOADERR, el('div', { style: 'margin-top:14px' },
      el('button', { class: 'chip', type: 'button', text: 'Thử lại', onclick: () => { LOADERR = ''; render(); refresh(true); } }))] : (canCall() ? 'Đang tải…' : 'Hãy mở bảng việc từ nút 📊 trong bot Telegram.')));
    return;
  }
  const dd = dayDate(dayIdx(DATA.now));
  setSubtitle(WDN[WD[dd.getUTCDay()]] + ', ' + dd.getUTCDate() + ' tháng ' + (dd.getUTCMonth() + 1) +
    ' · cập nhật ' + DATA.nowLabel.split(' ')[0]);
  main.replaceChildren();
  ({ week: renderWeek, stats: renderStats, all: renderAll })[UI.tab](main);
}
function setSubtitle(text) {
  const sub = document.getElementById('sub');
  if (sub) sub.textContent = text;
}
document.querySelectorAll('.top .tabs button').forEach(b => b.addEventListener('click', () => { UI.tab = b.dataset.tab; hideTip(); render(); scrollTo(0, 0); }));
document.querySelector('[role="tablist"]').setAttribute('aria-label', 'Bảng việc');
document.querySelector('[role="tablist"]').addEventListener('keydown', ev => {
  const tabs = Array.from(document.querySelectorAll('.top [role="tab"]'));
  const index = tabs.indexOf(document.activeElement);
  if (index < 0 || !['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(ev.key)) return;
  ev.preventDefault();
  const next = ev.key === 'Home' ? 0 : ev.key === 'End' ? tabs.length - 1 :
    (index + (ev.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;
  tabs[next].focus(); tabs[next].click();
});
document.getElementById('btnRefresh').appendChild(svgi('refresh'));
document.getElementById('btnRefresh').addEventListener('click', () => refresh(false, true));
function setupPullRefresh() {
  const status = document.getElementById('pullStatus');
  let start = null, pulling = false, distance = 0;
  const reset = () => { start = null; pulling = false; distance = 0; status.hidden = true; status.textContent = ''; };
  document.addEventListener('touchstart', ev => {
    reset();
    if (ev.touches.length !== 1 || window.scrollY > 0 || document.getElementById('btnRefresh').disabled ||
        document.querySelector('dialog[open]') || ev.target.closest('button, input, a, .chips, .chart')) return;
    start = { x: ev.touches[0].clientX, y: ev.touches[0].clientY };
  }, { passive: true });
  document.addEventListener('touchmove', ev => {
    if (!start || ev.touches.length !== 1 || window.scrollY > 0) return reset();
    const dx = ev.touches[0].clientX - start.x, dy = ev.touches[0].clientY - start.y;
    if (!pulling && (dy < 0 || Math.abs(dx) > Math.abs(dy))) return reset();
    if (dy < 12 && !pulling) return;
    pulling = true; distance = Math.max(0, dy);
    if (ev.cancelable) ev.preventDefault();
    status.hidden = false;
    status.textContent = distance >= 80 ? 'Thả để làm mới' : 'Kéo xuống để làm mới';
  }, { passive: false });
  document.addEventListener('touchend', () => {
    const ready = pulling && distance >= 80;
    reset();
    if (ready && !document.getElementById('btnRefresh').disabled && !document.querySelector('dialog[open]')) refresh(false, true);
  }, { passive: true });
  document.addEventListener('touchcancel', reset, { passive: true });
}
setupPullRefresh();
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (UI.tab === 'stats') render(); }, 150); });
setInterval(() => { if (document.visibilityState === 'visible') refresh(true); }, 5 * 60000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && FETCH_MODE) refresh(true); });
ensureContrast();
render();
if (FETCH_MODE || !DATA) refresh(true);   // trang Apps Script: chưa có số liệu nhúng → tải ngay sau khi hiện khung
  const initTelegram = () => { try {
    const w = window.Telegram && window.Telegram.WebApp;
    if (!w) return;
    applyThemeParams(w.themeParams);
    const syncInsets = () => {
      for (const [prefix, insets] of [['safe-area', w.safeAreaInset], ['content-safe-area', w.contentSafeAreaInset]]) {
        if (insets) for (const side of ['top', 'right', 'bottom', 'left'])
          document.documentElement.style.setProperty('--tg-' + prefix + '-inset-' + side, Math.max(0, Number(insets[side]) || 0) + 'px');
      }
    };
    syncInsets();
    w.onEvent('safeAreaChanged', syncInsets); w.onEvent('contentSafeAreaChanged', syncInsets);
    if (typeof w.disableVerticalSwipes === 'function' && typeof w.isVersionAtLeast === 'function' && w.isVersionAtLeast('7.7')) w.disableVerticalSwipes();
    w.ready(); w.expand(); w.onEvent('themeChanged', () => applyThemeParams(w.themeParams));
  } catch (e) { console.error('Telegram initialization failed', e); } };
  if (window.Telegram && window.Telegram.WebApp) initTelegram();
  else document.getElementById('tgWebAppScript').addEventListener('load', initTelegram, { once: true });
if (hasGAS() && google.script.url) google.script.url.getLocation(loc => applyTelegramTheme(loc.hash));
else applyTelegramTheme(location.hash);                       // trang riêng / bản xem thử
</script>
